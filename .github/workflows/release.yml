name: Validate SEXO2
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test services and update recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
# Releases are compiled and signed locally by scripts/release_local.ps1.
# The private signing key is never stored in GitHub Actions.
