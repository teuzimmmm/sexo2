name: Validate SEXO2
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test services and update recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          python -m unittest discover -s lcu/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'LCU tests failed.' }
          python -m unittest discover -s pengu/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Pengu tests failed.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        shell: pwsh
        run: |
          npm install --prefix ui-test-runtime --no-save --package-lock=false playwright@1.64.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed.' }
          & .\ui-test-runtime\node_modules\.bin\playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Isolated browser install failed.' }
      - name: Test champion select panel with synthetic bridge
        shell: pwsh
        run: |
          node tests/browser_builds.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Build panel tests failed.' }
# Releases are compiled and signed locally by scripts/release_local.ps1.
# The private signing key is never stored in GitHub Actions.
