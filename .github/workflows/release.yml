name: Publish SEXO2 update
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SEXO2_SIGNING_KEY_HEX: ${{ secrets.SEXO2_SIGNING_KEY_HEX }}
      SEXO2_DOWNLOAD_TOKEN: ${{ secrets.SEXO2_DOWNLOAD_TOKEN }}
    steps:
      - name: Skip an already published bootstrap release
        id: published
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { 'skip=true' >> $env:GITHUB_OUTPUT } else { 'skip=false' >> $env:GITHUB_OUTPUT }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require a marked version
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Publish from a version tag.' }
          if (-not $env:SEXO2_SIGNING_KEY_HEX) { throw 'Configure the signing secret before publishing.' }
      - name: Install build dependencies
        if: steps.published.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Download previous baseline
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          gh release download --pattern SEXO2-baseline.zip --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Publish the initial baseline before running this workflow.' }
          Expand-Archive -LiteralPath previous/SEXO2-baseline.zip -DestinationPath previous/app
          python scripts/prepare_release.py --base previous/app --version $env:GITHUB_REF_NAME
      - name: Test
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Build application and helper
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m PyInstaller SEXO2.spec --distpath dist-release --workpath build-release --noconfirm
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          python -m PyInstaller SEXO2-Updater.spec --distpath dist-helper --workpath build-helper --noconfirm
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed.' }
      - name: Package signed update
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          python audit_frozen.py dist-release/SEXO2
          if ($LASTEXITCODE -ne 0) { throw 'Frozen audit failed.' }
          python scripts/package_update_release.py --base previous/app --new dist-release/SEXO2 --helper 'dist-helper/SEXO2 Update.exe' --version $env:GITHUB_REF_NAME --output release
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          python scripts/build_patch.py --base previous/app --new dist-release/SEXO2 --output release/SEXO2-update.zip --version $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Patch signing failed.' }
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME 'release/SEXO2-update.zip' 'release/SEXO2-baseline.zip' 'release/SEXO2 Update.exe' --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
