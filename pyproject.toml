# Tooling only; the application is built by PyInstaller, not packaged from here.

[tool.ruff]
target-version = "py313"  # keeps `except (A, B)` parenthesized; 3.14-only syntax breaks older tools
line-length = 120
extend-exclude = ["vendor", "Pengu Loader", "docs"]

[tool.ruff.lint]
# Blocking set: syntax errors and undefined names only. Wider rules are
# reported by CI without failing until the code is formatted (milestone M3).
select = ["E9", "F63", "F7", "F82"]
