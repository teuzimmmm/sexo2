 if(m.type==='rm'){const x=S.mods.find(z=>z.id===m.id);t='Remover mod';b=`<p>Remover <b>${esc(x.name)}</b> da biblioteca? (simulado; nenhum arquivo real é apagado)</p>`;f=B('Cancelar','mclose')+B('Remover','modRmGo',m.id,'pri dng')}
 if(m.type==='modEdit'){const d=S.imp;t=d.isNew?'Importar pacote de exemplo':'Editar mod';b=`<label class="f">Nome<input type="text" id="impName" value="${esc(d.name)}" autocomplete="off"></label><div class="grid g2" style="margin-top:8px">${SEL('impCat','Categoria',d.cat,CATS,'data-imp="cat"')}${SEL('impState','Estado do jogo (simulado)',d.game,[['fora','Fora da seleção'],['selecao','Em seleção de campeões']],'data-imp="game"')}</div>
 ${d.cat==='Skins'?`<div class="grid g2" style="margin-top:8px">${SEL('impChamp','Campeão',d.champ,[['','— escolha —'],...CHAMPS],'data-imp="champ"')}${SEL('impBase','Skin-base',String(d.base),d.champ?skinsOf(d.champ).map(s=>[String(s.id),s.name]):[['0','— escolha o campeão —']],'data-imp="base"')}</div><p class="tiny" style="margin-top:6px">Pacotes de skin precisam de campeão e skin-base para saber o que substituir.</p>`:''}
 ${d.isNew&&d.game==='selecao'?'<div class="alert info" style="margin-top:8px">Em seleção de campeões, a importação espera o fim da seleção.</div>':''}`;
 const bad=d.cat==='Skins'&&!d.champ||!d.name.trim();f=B('Cancelar','mclose')+B(d.isNew?'Importar':'Salvar','impGo','','pri',bad?'disabled':'')+(bad?`<span class="tiny" style="align-self:center">${!d.name.trim()?'Informe um nome.':'Escolha o campeão.'}</span>`:'')}
 $('#dlgT').textContent=t;$('#dlgB').innerHTML=b;$('#dlgF').innerHTML=f}
/* ---------- ações ---------- */
const A={
 nav:p=>go(p,true),tab:v=>{const[k,n]=v.split(':');S.tab[k]=n;S.focusNext='tab|'+v},
 dismiss:()=>{S.alert=null},
 toSupport:()=>{const f=ctxPage();S.back={to:'Suporte',page:f,label:f==='Seleção'?'seleção de campeões':f};S.page='Suporte';S.hub=true;S.alert=null;S.focusNext='h1'},
 back:()=>{const b=S.back;S.back=null;S.alert=null;if(b.page==='Seleção'){S.hub=false;S.sim='selecao';S.panelOpen=true;S.focusNext='launcher'}else{S.page=b.page;S.hub=true;S.focusNext='h1'}say('De volta: '+b.label)},
 hubToggle:()=>{S.hub=!S.hub;if(S.hub)S.page='Sala';S.focusNext=S.hub?'h1':'hubToggle|';say(S.hub?'Painel aberto':'Painel fechado')},
 hubClose:()=>{S.hub=false;S.focusNext=S.sim==='selecao'&&S.back&&S.back.page==='Seleção'?'launcher':'hubToggle|';say('Painel fechado')},
 sim:v=>{S.sim=v;S.hub=false;if(v==='selecao')S.panelOpen=true;say('Simulação: '+({cliente:'Client (lobby)',selecao:'Seleção de campeões',partida:'Partida'})[v])},
 simReset:()=>{location.reload();return false},
 pick:c=>{S.sel.champ=c;S.confirmed=false;say('Campeão: '+c)},
 mode:v=>{S.mode=v;if(v!=='swiftplay'&&S.page==='Swiftplay')S.page='Sala';say('Modo: '+(v==='swiftplay'?'Swiftplay':'Normal'))},
 favOpen:c=>{S.favChamp=c;S.favHi=-1;S.fsel={skin:1,chroma:-1};S.focusNext='h1';say('Campeão: '+c)},
 favSkinGo:v=>{const[c,i]=v.split('|');S.favChamp=c;S.fsel={skin:+i,chroma:-1};S.favHi=+i;S.focusNext='h1';say('Skin encontrada: '+lab(c,+i,-1))},
 favBack:()=>{S.focusNext='h1';S.favChamp=null},
 fskin:i=>{S.fsel={skin:+i,chroma:-1};say('Skin selecionada')},
 fchroma:v=>{const[a,b]=v.split(':').map(Number);S.fsel=(S.fsel.skin===a&&S.fsel.chroma===b)?{skin:a,chroma:-1}:{skin:a,chroma:b};say('Croma selecionado')},
 ffav:()=>{const k=favKey(S.favChamp,S.fsel.skin,S.fsel.chroma);S.fav.has(k)?S.fav.delete(k):S.fav.add(k);say((S.fav.has(k)?'Favoritada: ':'Favorita removida: ')+lab(S.favChamp,S.fsel.skin,S.fsel.chroma))},
 swSkin:v=>{const[i,k]=v.split(':').map(Number);S.sw[i]={skin:k,chroma:-1,res:null};say('Skin escolhida manualmente para '+S.swc[i])},
 swChroma:v=>{const[i,k,j]=v.split(':').map(Number);const w=S.sw[i];S.sw[i]={skin:k,chroma:(w.skin===k&&w.chroma===j)?-1:j,res:null};say('Croma escolhido para '+S.swc[i])},
 swClear:i=>{S.sw[+i]={skin:null,chroma:-1,res:null};say('Escolha limpa para '+S.swc[+i]+': valerá o sorteio estilo Bravura')},
 swStart:()=>{if(S.fail){raise('Swiftplay','Não foi possível preparar as skins: o cliente não respondeu','SWF-PREP-504');return}S.sw.forEach((w,i)=>{const c=S.swc[i];w.res=w.skin!==null?{label:lab(c,w.skin,w.chroma),src:'escolhida manualmente'}:(r=>({label:r.label,src:'sorteio estilo Bravura · '+r.src}))(pickSkin(c))});S.alert=null;say('Swiftplay (simulado): '+S.swc.map((c,i)=>S.sw[i].res.label).join(' | '))},

 confirmChamp:()=>{S.confirmed=true;A.itemConfirm();say('Campeão confirmado (simulado); '+S.itemMsg)},
 bravStep:n=>{const v=S.brav;if(n==='1'){v.step=1;say('Bravura confirmada na seleção (campeão -3)')}else if(n==='2'){v.champ=CHAMPS[Math.floor(Math.random()*CHAMPS.length)];v.step=2;say('Jogo revelou o campeão: '+v.champ)}else{const r=pickSkin(v.champ);v.res=r;v.step=3;say('Bravura: skin '+r.src+' escolhida; reconectando')}},
 bravReset:()=>{S.brav={step:0,champ:null,res:null};say('Simulação de Bravura reiniciada')},
 recheck:()=>{S.fail=false;S.errors.forEach(e=>e.resolved=true);S.alert=null;S.checked='Verificação repetida: cliente respondeu; erros marcados como resolvidos.';say(S.checked)},
 report:()=>{S.report='SEXO2 demo | recursos locais OK | cliente: '+(S.fail?'sem resposta':'desconectado')+' | erros abertos: '+S.errors.filter(e=>!e.resolved).length+' | sem chave de sala';S.reportCopied=false;say('Relatório gerado')},
 reportCopy:()=>{try{navigator.clipboard&&navigator.clipboard.writeText(S.report).catch(()=>{})}catch(e){}S.reportCopied=true;say('Relatório copiado (simulado)')},
 folder:n=>{S['f'+n]=true;say('Pasta '+n+' aberta (simulado)')},
 /* conjuntos */
 mclose:()=>{S.imp=null;closeModal();return false},
 /* mods */
 modCat:c=>{S.modCat=c;say('Categoria: '+c)},
 modOn:id=>{const m=S.mods.find(x=>x.id==id);m.on=!m.on;say(m.name+(m.on?' ativado':' desativado'))},
 impOpen:()=>{S.imp={isNew:true,name:'Pacote de exemplo '+(S.modN-9),cat:'Skins',champ:'',base:'0',game:'fora'};openModal({type:'modEdit'})},
 modEdit:id=>{const m=S.mods.find(x=>x.id==id);S.imp={id:m.id,name:m.name,cat:m.cat,champ:m.champ||'',base:String(m.base||0),game:'fora'};openModal({type:'modEdit'})},
 impGo:()=>{const d=S.imp;if(d.isNew){S.modN++;S.mods.push({id:S.modN,name:d.name.trim(),cat:d.cat,champ:d.cat==='Skins'?d.champ:undefined,base:+d.base,on:false,st:d.game==='selecao'?'Na fila · aguarda fim da seleção':'Pronto'});say('Importado (simulado): '+d.name+(d.game==='selecao'?' · na fila':''))}else{const m=S.mods.find(x=>x.id===d.id);Object.assign(m,{name:d.name.trim(),cat:d.cat,champ:d.cat==='Skins'?d.champ:undefined,base:+d.base});say('Mod atualizado: '+m.name)}S.imp=null;closeModal();return false},
 impErr:()=>raise('Mods','Importação falhou: pacote corrompido (exemplo)','MOD-IMPORT-12'),
 endSel:()=>{S.mods.forEach(m=>{if(m.st.startsWith('Na fila'))m.st='Pronto'});say('Seleção encerrada (simulado): fila importada')},
 modExp:id=>{const m=S.mods.find(x=>x.id==id);m.exp=true;S.lastExport=m.name.replace(/\s+/g,'-').toLowerCase()+'.fantome';say('Exportado (simulado): '+S.lastExport)},
 modRm:id=>openModal({type:'rm',id:+id}),modRmGo:id=>{const m=S.mods.find(x=>x.id==id);S.mods=S.mods.filter(x=>x.id!=id);say('Removido (simulado): '+m.name);closeModal();return false},
 /* sala */
 roomCreate:()=>{const r=S.room;r.n++;r.on=true;r.key='SX2-7F3K-92Q'+r.n;r.copied=false;r.parts=['Você (anfitrião)'];r.err='';say('Sala criada (simulado): '+r.key)},
 roomJoin:()=>{const r=S.room;if(!/^SX2-[A-Z0-9]{4}-[A-Z0-9]{4}$/i.test(r.input.trim())){r.err='Chave inválida. Use o formato SX2-XXXX-XXXX.';say(r.err);return}r.on=true;r.key=r.input.trim().toUpperCase();r.err='';r.copied=false;r.parts=['Você','Anfitrião demo'];say('Conectado à sala '+r.key+' (simulado)')},
 roomCopy:()=>{try{navigator.clipboard&&navigator.clipboard.writeText(S.room.key).catch(()=>{})}catch(e){}S.room.copied=true;say('Chave copiada (simulado): '+S.room.key)},
 roomLeave:()=>{const r=S.room;r.last=r.key;r.on=false;r.key=null;r.parts=[];S.coord=false;S.roomResult=null;say('Você saiu da sala '+r.last)},
 roomRejoin:()=>{const r=S.room;r.on=true;r.key=r.last;r.copied=false;r.parts=['Você','Anfitrião demo'];say('Reconectado à sala '+r.key)},
 roomAdd:()=>{S.room.parts.push('Jogador '+S.room.parts.length);say('Participante demo adicionado')},
 /* config */
 cfgSave:()=>{const n=dirty();S.prefs={...S.draft};S.draft=null;S.saved='Salvo (simulado): '+n+' alteração(ões)';say(S.saved)},
 cfgCancel:()=>{S.draft=null;S.saved=null;say('Alterações descartadas')},
 toCfg:()=>{S.back={to:'Configurações',page:'Seleção',label:'seleção de campeões'};S.page='Configurações';S.hub=true;S.qp=false;S.tab.cfg='Seleção';S.focusNext='h1';say('Configurações completas; rascunho preservado')},
 /* assistente */
 panelToggle:()=>{S.panelOpen=!S.panelOpen;say(S.panelOpen?'Painel aberto':'Painel fechado')},
 qpToggle:()=>{S.qp=!S.qp;S.focusNext=S.qp?'pref-autoaceite':'qpToggle|'},
 compare:()=>{S.compare=!S.compare;say(S.compare?'Comparando fontes lado a lado':'Fonte preferida: '+P('fonte'))},
 runeEdit:()=>{S.run.editing=!S.run.editing},
 runeKey:k=>{S.run.key=+k;S.run.edits++;say('Runa-chave editada: '+RUNE[k])},
 runeImport:id=>{const R=S.run,tok=++R.tok;const nm=id==='edit'?RPAGES[0].name.replace('Eletrocutar',RUNE[R.key])+' (editada)':(RPAGES.find(p=>p.id===String(id).replace('-ot',''))||RPAGES[0]).name;R.page=id;R.status='importing';R.msg=nm;say('Importando runas: '+nm);
  setTimeout(()=>{if(R.tok!==tok)return;const o=S.simRes;R.status=o;R.msg=o==='success'?'«'+nm+'» importada como página «SEXO2». Páginas pessoais intactas.':o==='failed'?'O cliente recusou «'+nm+'». Nenhuma página foi alterada.':'Sem página livre para «'+nm+'». Nenhuma página pessoal foi apagada; libere uma página no cliente.';say('Runas: '+o+' · '+nm);rerender()},650)},
 trioUse:id=>{S.trio=id;S.itemMsg=null;say('Trio em uso: '+tName(TRIOS.find(t=>t.id===id)))},
 trioReset:()=>{S.trio=null;S.itemMsg=null;say('Build padrão restaurada')},
 itemConfirm:()=>{const t=TRIOS.find(x=>x.id===S.trio);S.itemMsg='Itens importados (simulado): '+(t?'trio «'+tName(t)+'» antes do padrão':'build padrão')+'.';say(S.itemMsg)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=A[el.dataset.act];if(!a)return;lastAct=el;const r=a(el.dataset.arg,el);if(r!==false)rerender()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.swc!==undefined){const i=+t.dataset.swc;if(t.value===S.swc[1-i]){say('Escolha dois campeões diferentes');rerender();return}S.swc[i]=t.value;S.sw[i]={skin:null,chroma:-1,res:null};say('Swiftplay: campeão '+(i+1)+' = '+t.value);rerender();return}
 if(t.dataset.pref){S.draft=S.draft||{...S.prefs};S.draft[t.dataset.pref]=t.type==='checkbox'?t.checked:t.value;S.saved=null;say('Rascunho: '+dirty()+' alteração(ões) não salva(s)');rerender();return}
 if(t.dataset.imp){S.imp[t.dataset.imp]=t.value;if(t.dataset.imp==='champ')S.imp.base='0';rerender();return}
 if(t.dataset.st){const k=t.dataset.st;if(k==='champ')A.champ(t.value);else if(k==='fail'){S.fail=t.checked;say('Falha do cliente '+(S.fail?'ligada':'desligada')+' (simulação)')}else{S[k]=t.value;say('Ajuste: '+t.value)}rerender()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.pref){S.draft=S.draft||{...S.prefs};S.draft[t.dataset.pref]=t.value;S.saved=null;document.querySelectorAll('.dbar').forEach(d=>d.innerHTML=dbar());return}
 if(t.id==='modQ'){S.modQ=t.value;$('#modList').innerHTML=modRowsA(modFilter())}
 if(t.id==='favQ'){S.favQ=t.value;const q=norm(t.value),l=CHAMPS.filter(n=>!q||norm(n).includes(q));$('#champGrid').innerHTML=champTiles(l);$('#skinHits').innerHTML=hitsHTML(q);if(q&&!l.length&&!skinHits(q).length)$('#champGrid').innerHTML='<p class="muted" style="grid-column:1/-1">Nenhum campeão ou skin encontrado.</p>';$('#champCount').textContent=l.length+' de '+CHAMPS.length+' campeões · '+CHAMPS.filter(hasImg).length+' com retrato local; os demais mostram um placeholder.'}
 if(t.id==='itemQ'){S.itemQ=t.value;$('#trioList').innerHTML=trioRows()}
 if(t.id==='roomKey')S.room.input=t.value;
  if(t.id==='impName'){S.imp.name=t.value;const ok=S.imp.name.trim()&&!(S.imp.cat==='Skins'&&!S.imp.champ);const g=$('[data-act=impGo]');if(g)g.disabled=!ok}});
document.addEventListener('keydown',e=>{const dlgOpen=$('#dlg').open;
 if(e.key==='Escape'&&!dlgOpen){if(S.qp){S.qp=false;S.focusNext='qpToggle|';rerender()}else if(S.hub){A.hubClose();rerender()}else if(S.sim==='selecao'&&S.panelOpen){S.panelOpen=false;S.focusNext='launcher';rerender()}}
 if(e.key==='Tab'&&!dlgOpen&&S.hub){const f=[...document.querySelectorAll('#hub button,#hub input,#hub select,#hub a[href]')].filter(n=>!n.disabled&&n.offsetParent!==null),a=document.activeElement;if(!f.length)return;if(!a.closest('#hub')){e.preventDefault();f[0].focus()}else if(e.shiftKey&&a===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&a===f.at(-1)){e.preventDefault();f[0].focus()}}
 if(e.key==='Enter'&&e.target.id==='roomKey'){A.roomJoin();rerender()}});
addEventListener('hashchange',()=>{applyHash();rerender()});
render();
</script>
