let returnFocus;function openModal(title,body){returnFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal();$('#close').focus();}function closeModal(){$('#modal').close();returnFocus?.focus();}$('#close').onclick=closeModal;$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('#modal').addEventListener('keydown',e=>{if(e.key==='Tab'){const f=[...$('#modal').querySelectorAll('button,a,input,select')].filter(n=>!n.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('change',e=>{if(e.target.dataset.select){state[e.target.dataset.select]=e.target.value;render();note('Preferência atualizada nesta sessão.')}if(e.target.dataset.setting){state.settings[e.target.dataset.setting]=e.target.checked;note('Configuração salva nesta sessão.')}if(e.target.id==='modFile'&&e.target.files[0]){state.mods.push(esc(e.target.files[0].name));note('Nome do pacote registrado. Conteúdo não importado.')}});document.addEventListener('input',e=>{if(e.target.id==='itemSearch')$('#itemResults').innerHTML=itemRows(e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.set){state[b.dataset.set]=b.dataset.value;render();return}const a=b.dataset.action;if(!a)return;const pages={selection:'Seleção de campeões',skins:'Skins',room:'Sala',support:'Suporte',allSettings:'Configurações',mods:'Mods'};if(pages[a]){state.page=pages[a];render();return}if(a==='compare'){state.compare=!state.compare}else if(a==='profiles'){state.page='Skins';state.skinTab='Perfis'}else if(a==='collection')state.skinTab='Coleção';else if(a.startsWith('skin:'))state.skin=a.slice(5);else if(a==='favorite'){state.favorite=!state.favorite;note(state.favorite?'Skin marcada como favorita.':'Favorita removida.')}else if(a==='apply'){state.applied=state.champ+' · '+state.skin;note('Skin aplicada na demonstração. Cliente não alterado.')}else if(a==='wheel'){openModal('Custom wheel · seleção',`<p>Selecione o efeito desejado para esta skin.</p>${button('Padrão','wheelChoice:Padrão')} ${button('Alternativa custom','wheelChoice:Alternativa custom')}<p style="margin-top:16px">Seleção demonstrativa, sem uso da roda do mouse.</p>`);return}else if(a.startsWith('wheelChoice:')){note('Custom wheel: '+a.slice(12)+' selecionado.');closeModal();return}else if(a==='profileApply'){if(state.profile==='Noite custom'){openModal('Revisar conflito antes de entrar',`<div class="warning">O perfil contém dois recursos de mapa incompatíveis. Desative o mapa anterior para continuar.</div><p>Prévia: Noite custom · skin custom · fonte Inter.</p>${button('Resolver conflito e aplicar','resolveProfile','primary')}`);return}state.profileApplied=state.profile;note('Perfil aplicado nesta sessão.')}else if(a==='resolveProfile'){state.profileApplied=state.profile;state.settings['Rift noturno']=true;note('Conflito resolvido: apenas Rift noturno ativo. Perfil aplicado.');closeModal()}else if(a.startsWith('mod:')){const n=a.slice(4);state.settings[n]=!state.settings[n];note('Estado do mod atualizado na demo.')}else if(a.startsWith('edit:')){openModal('Editar mod demo',`<label>Nome de exibição<input id="modName" type="text" value="${a.slice(5)}"></label>${button('Salvar edição demo','saveMod','primary')}`);return}else if(a==='saveMod'){state.mods.push(esc($('#modName').value));note('Edição demonstrativa salva: '+$('#modName').value);closeModal();return}else if(a==='importMod'){state.mods.push('Pacote de exemplo');state.modTab='Biblioteca';note('Pacote de exemplo adicionado.')}else if(a==='connect'){state.room=!state.room;note(state.room?'Sala demo conectada.':'Sala demo desconectada.')}else if(a==='participant'){if(!state.room){note('Conecte a sala demo primeiro.');return}state.participants.push('Jogador '+state.participants.length)}else if(a==='roomDraw'){if(!state.room){note('Conecte a sala demo antes do sorteio.');return}$('#roomResult').textContent=state.participants.map((n,i)=>n+': '+['Ahri','Lux','Jinx','Yasuo'][i%4]+' · elegível').join(' / ');note('Sorteio coordenado PROPOSTA concluído; aguardando revisão individual.');return}else if(a==='draw'){state.skin='Florescer espiritual';note('PROPOSTA: skin elegível sorteada; Exalted + croma excluído antes do ranking.')}else if(a==='bravery')state.bravery=(state.bravery+1)%3;else if(a.startsWith('runes:')){note('Página de runas '+a.slice(6)+' aplicada na demonstração.');return}else if(a==='diagnostic'){$('#diagnosticResult').textContent='Diagnóstico demo concluído: assets prontos. Cliente e API desconectados, sem erro local.';note('Diagnóstico demonstrativo concluído.');return}else if(a==='report'){openModal('Relatório para copiar','<label>Relatório demonstrativo<input type="text" readonly value="SEXO2 demo | assets OK | cliente desconectado | sem erros"></label><p>Selecione o texto e use Ctrl+C ou Command+C.</p>');return}else if(a==='folders'){openModal('Pastas demonstrativas','<p>Skins: SEXO2/skins<br>Mods: SEXO2/mods<br>Logs: SEXO2/logs</p><small>Caminhos de exemplo. Nenhuma pasta foi aberta.</small>');return}render();});render();
</script></html>
