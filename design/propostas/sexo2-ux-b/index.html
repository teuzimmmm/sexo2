<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEXO2 — Por atividade</title><style>
@font-face{font-family:Inter;src:url('../sexo2-shared/inter.woff2')}@font-face{font-family:Oswald;src:url('../sexo2-shared/oswald.woff2')}*{box-sizing:border-box}body{margin:0;background:#08171e;color:#e4ecec;font:13px Inter,sans-serif;height:100vh;overflow:hidden}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #edc579}button{cursor:pointer;color:inherit;background:#17303a;border:1px solid #35505a;padding:10px 14px;border-radius:4px}button:hover{background:#24434d}button.active,.gold{background:#c5a36b;color:#10232b;border-color:#c5a36b}a{color:#dbc18e}header{height:77px;display:flex;align-items:center;gap:24px;padding:0 30px;border-bottom:1px solid #31444c}header strong{font:26px Oswald;letter-spacing:3px}header small{font-size:9px;letter-spacing:2px;color:#b9a47a}.demo{margin-left:auto;color:#d5bc88;font-size:10px;letter-spacing:1px}nav{display:flex;gap:7px}main{height:calc(100vh - 117px);overflow:auto;padding:25px 32px}footer{height:40px;border-top:1px solid #31444c;padding:12px 32px;color:#9bafb5;font-size:10px;display:flex;justify-content:space-between}h1,h2,h3,p{margin:0}h1{font:32px Oswald;letter-spacing:.3px}h2{font:23px Oswald}h3{font-size:15px}p{color:#a6bbc2;line-height:1.65;margin-top:9px}.eyebrow{color:#c5a36b;font-size:10px;letter-spacing:2px;margin-bottom:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.top{margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.panel{background:#102731;border:1px solid #2c4651;border-radius:6px;padding:22px}.activity{height:290px;text-align:left;padding:28px;display:flex;flex-direction:column;justify-content:space-between;background:#102731}.activity b{font:27px Oswald}.number{font:42px Oswald;color:#58727b}.muted{color:#a0b5bd}.small{font-size:11px}.tabs{display:flex;gap:6px;margin:16px 0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.stack>*+*{margin-top:14px}.line{border-top:1px solid #2c4651;margin:17px 0}.tag{font-size:10px;border:1px solid #50656a;padding:4px 7px;border-radius:3px;color:#c9d4d6}.ok{color:#a3ceba}label{display:block;color:#b5c6cc;font-size:11px;margin-bottom:7px}input,select{padding:9px;background:#091e27;color:#e1e9eb;border:1px solid #39545d;border-radius:3px;max-width:100%}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.source{flex:1;min-width:220px}.source img,.items img{width:40px;height:40px;border-radius:3px}.champ{width:76px;height:76px;border-radius:5px}.items{display:flex;gap:8px;align-items:center}.notice{padding:12px;background:#24362f;border-left:2px solid #b8a16f;line-height:1.5;color:#cbd5cb}.scroll{max-height:235px;overflow:auto}.empty{padding:30px;text-align:center}dialog{background:#102731;color:#e4ecec;border:1px solid #71818a;border-radius:7px;padding:26px;width:690px;max-height:85vh}dialog::backdrop{background:#020e16c9}dialog .body{max-height:55vh;overflow:auto;margin:18px 0}.check{display:flex;align-items:center;gap:9px;margin:12px 0}.check input{accent-color:#c5a36b}#toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#d1b57e;color:#10232b;padding:12px 22px;border-radius:4px;display:none;z-index:5}.preview{height:100px;display:flex;align-items:center;gap:20px;background:#0b2029;padding:15px;border:1px solid #304b56;margin:15px 0}@media(max-width:850px){header{padding:0 12px;gap:10px}header nav button{padding:8px}.workspace{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.activity{height:180px}main{padding:20px}.demo{max-width:110px}.fields{grid-template-columns:1fr}}
</style><body><header><strong>SEXO2</strong><small>SEU JOGO.<br>SEU RITUAL.</small><nav id="nav"></nav><span class="demo">DEMONSTRAÇÃO LOCAL</span><button onclick="settings()" aria-label="Abrir todas as configurações">Configurações</button></header><main id="main"></main><footer><span>CLIENTE SIMULADO · NENHUMA ALTERAÇÃO NO LEAGUE OF LEGENDS</span><span><a href="../sexo2-ux-a/index.html">Explorar proposta A</a> &nbsp; / &nbsp; CONCEITO B · ATIVIDADES</span></footer><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div class="row space"><h2 id="mtitle"></h2><button onclick="closeModal()" aria-label="Fechar janela">Fechar ×</button></div><div class="body" id="mbody"></div></dialog><script>
const A='../sexo2-shared/';const state={activity:'home',step:0,tab:'Runas',collection:'Skins',source:'Lolalytics',champ:'Ahri',skin:'Florescer Espiritual',favorite:false,profile:'Essencial',applied:'Essencial',room:false,mods:['Mapa crepúsculo'],config:'Geral',compare:false,options:{},session:{}};let lastFocus;const main=document.querySelector('#main');const btn=(t,f,c='')=>`<button class="${c}" onclick="${f}">${t}</button>`;const img=(kind,name,cl='')=>`<img class="${cl}" src="${A+kind+'/'+name+'.png'}" alt="${name}">`;function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',4000)}function go(a){state.activity=a;render()}function render(){document.querySelector('#nav').innerHTML=[['home','Workspace'],['prepare','Preparar partida'],['collection','Personalizar coleção'],['support','Resolver problema']].map(([a,t])=>btn(t,`go('${a}')`,state.activity===a?'active':'')).join('');if(state.activity==='home')home();if(state.activity==='prepare')prepare();if(state.activity==='collection')collection();if(state.activity==='support')support()}
function home(){main.innerHTML=`<div class="top"><div class="eyebrow">WORKSPACE / BOA NOITE, INVOCADOR</div><h1>O que você quer fazer agora?</h1><p>Três caminhos, um conjunto pronto para jogar.</p></div><div class="grid">${[['01','Preparar partida','Da fila ao Nexus. Reúna seu perfil, runas e escolhas em um único preparo.','prepare'],['02','Personalizar coleção','Skins, favoritas e mods. Monte conjuntos com a sua identidade.','collection'],['03','Resolver problema','Verifique a prontidão, entenda um erro e retome seu jogo.','support']].map(([n,t,d,a])=>`<button class="activity" onclick="go('${a}')"><span class="number">${n}</span><div><b>${t}</b><p>${d}</p></div><span style="color:#d8bd87">Abrir atividade →</span></button>`).join('')}</div><div class="row space panel" style="margin-top:20px"><span><span class="ok">● Pronto no ambiente de demonstração</span><p class="small">Último conjunto: ${state.applied} · Ahri / Meio</p></span>${btn('Retomar preparo',"go('prepare')")}</div>`}
function prepare(){main.innerHTML=`<div class="row space top"><div><div class="eyebrow">ATIVIDADE 01 / PREPARAR PARTIDA</div><h1>Seu próximo jogo começa aqui.</h1></div><span class="tag">${state.room?'SALA LOCAL · 3 PARTICIPANTES':'PREPARO PESSOAL'}</span></div><div class="tabs">${['Antes da fila','Na seleção','Em jogo'].map((t,i)=>btn((i+1)+' · '+t,`state.step=${i};prepare()`,state.step===i?'active':'')).join('')}</div><div class="workspace"><section class="panel" id="stage"></section><aside class="panel stack"><div class="eyebrow">CONJUNTO DA SESSÃO</div><h2>${state.applied}</h2><div class="row">${img('champions',state.champ,'champ')}<div><h3>${state.champ}</h3><p>Meio · Ranqueada</p></div></div><div class="line"></div><p>Skin · ${state.skin}<br>Fonte preferida · ${state.source}<br>Runas · Aguardando escolha<br>Overlay · Visão essencial</p><div class="line"></div><span class="ok">● Compatibilidade verificada (demo)</span><p class="small">As escolhas desta sessão são mantidas apenas enquanto esta página está aberta.</p>${btn('Revisar perfil',"profileModal()")}</aside></div>`;let s=document.querySelector('#stage');if(state.step===0)s.innerHTML=`<div class="row space"><h2>Antes da fila</h2><span class="tag">1 DE 3</span></div><p>Revise seu conjunto e escolha como decidir a próxima skin.</p><div class="fields"><div><label for="queue">Fila</label><select id="queue"><option>Ranqueada Solo/Duo</option><option>Normal</option><option>ARAM</option></select></div><div><label for="profile">Perfil do conjunto</label><select id="profile" onchange="state.profile=this.value">${['Essencial','Competitivo','Expressivo'].map(p=>`<option ${state.profile===p?'selected':''}>${p}</option>`).join('')}</select></div><div><label>&nbsp;</label>${btn('Prévia e aplicar',"profileModal()")}</div></div><div class="line"></div><div class="row space"><div><h3>${state.room?'Sala de preparo · CTX-204':'Preparar com amigos'}</h3><p>${state.room?'Matheus · Lia · Pedro · prontos na simulação':'Sala é um contexto compartilhado deste preparo.'}</p></div>${btn(state.room?'Sair da sala':'Criar sala local','state.room=!state.room;prepare()')}</div><div class="line"></div><h3>Sorteio ${state.room?'coordenado':'pessoal'}</h3><p>Primeiro filtramos elegíveis. Só depois ordenamos as opções.</p><p class="small">Excluídas: Exalted com croma que desativa CTRL5. Ponderação futura; resultado ilustrativo sem fórmula de probabilidade.</p><div class="row" style="margin-top:14px">${btn(state.room?'Sortear para a sala':'Sortear minha skin',"draw()",'gold')}${btn('Bravura · proposta',"bravery()")}</div><div class="row space" style="margin-top:24px"><span class="small muted">Prontidão local verificada · 4/4</span>${btn('Entrar na seleção →',"enterSelection()")}</div>`;
if(state.step===1)s.innerHTML=`<div class="row space"><h2>Na seleção</h2>${btn('Todas as configurações',"settings()")}</div><div class="fields"><div><label for="champ">Campeão</label><select id="champ" onchange="state.champ=this.value;prepare()">${['Ahri','Jinx','Lux','Akali'].map(c=>`<option ${c===state.champ?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="route">Rota</label><select id="route"><option>Meio</option><option>Atirador</option><option>Topo</option></select></div><div><label for="match">Confronto</label><select id="match"><option>Sem adversário</option><option>Zed</option><option>Yasuo</option></select></div></div><div class="tabs">${['Runas','Itens','Mods'].map(t=>btn(t,`state.tab='${t}';prepare()`,state.tab===t?'active':'')).join('')}${btn('Preferências da sessão',"sessionPrefs()")}</div><div id="selection"></div>`;if(state.step===1)selection();if(state.step===2)s.innerHTML=`<h2>Em jogo</h2><p>Seu conjunto acompanha a partida. O overlay fica em uma experiência dedicada.</p><div class="preview">${img('champions',state.champ,'champ')}<div><h3>Visão essencial</h3><p>Timers · objetivos · lembretes de compra</p></div></div><a href="../sexo2-overlays/index.html">Abrir demonstração dos overlays →</a><div class="line"></div>${btn('Simular fim da partida',"state.step=0;prepare();toast('Partida encerrada na demonstração.')")}`}
function selection(){let e=document.querySelector('#selection');if(state.tab==='Runas')e.innerHTML=`<div class="row space" style="margin-bottom:12px"><span class="small muted">Origem · proposta pendente D008/016 · preferência habitual: ${state.source}</span>${btn(state.compare?'Fechar comparação':'Comparar fontes lado a lado',"state.compare=!state.compare;selection()")}</div><div class="row">${['Lolalytics','Onetricks'].filter(n=>state.compare||n===state.source).map((n,i)=>`<article class="panel source"><div class="row space"><h3>${n}</h3><span class="tag">${n==='Onetricks'?'FUTURO · SIMULADO':'DADOS ILUSTRATIVOS'}</span></div><p>${n==='Onetricks'?'Preferências de especialistas · simulado':'Visão agregada de partidas'}</p><div class="row" style="margin:14px 0">${[i?'8112':'8214','8226','8210','8237'].map(r=>img('runes',r)).join('')}</div><p>WR ${i?'53,1':'51,8'}% · ${i?'840':'12.480'} partidas ilustrativas</p><div class="row" style="margin-top:12px">${btn(state.source===n?'Fonte preferida':'Preferir esta fonte',`state.source='${n}';prepare()`,state.source===n?'active':'')}${btn('Usar runas',`toast('Página ${n} selecionada para a sessão (demo).')`)}</div></article>`).join('')}</div>`;if(state.tab==='Itens')e.innerHTML=`<h3>Trios observados · ${state.source}</h3><p class="small">Combinações estatísticas de 3 itens; não representam seis slots de inventário.</p><label for="search" style="margin-top:12px">Filtrar por item</label><input id="search" placeholder="Ex.: Rabadon ou Luden" oninput="filterItems(this.value)"><div id="trios" class="stack" style="margin-top:14px"></div>`;if(state.tab==='Itens')filterItems('');if(state.tab==='Mods')e.innerHTML=`<h3>Mods da sessão · Skins</h3><p>Skins e conteúdo visual reunidos no contexto de Mods.</p><div class="preview">${img('champions',state.champ,'champ')}<div><h3>${state.skin}</h3><p>${state.champ} · Escolha da sessão</p></div></div><div class="row">${btn('Trocar skin',"skinModal()")}${btn('Aplicar na sessão',"toast('Skin aplicada ao conjunto local.')",'gold')}</div>`}
function filterItems(q){let rows=[['Luden · Chama Sombria · Rabadon',['6655','4645','3089'],'52,8%','4.280'],['Liandry · Rabadon · Cajado do Vazio',['6653','3089','3135'],'51,4%','2.610']];document.querySelector('#trios').innerHTML=rows.filter(r=>r[0].toLowerCase().includes(q.toLowerCase())).map(r=>`<div class="panel row space"><div class="items">${r[1].map(x=>img('items',x)).join('')}<span>${r[0]}</span></div><span>${r[2]} WR · ${r[3]} partidas</span></div>`).join('')||'<p>Nenhum trio encontrado.</p>'}
function collection(){main.innerHTML=`<div class="top"><div class="eyebrow">ATIVIDADE 02 / PERSONALIZAR COLEÇÃO</div><h1>Uma coleção. Vários jeitos de jogar.</h1></div><div class="tabs">${['Skins','Favoritas','Perfis','Mods','Custom-wheel'].map(t=>btn(t,`state.collection='${t}';collection()`,state.collection===t?'active':'')).join('')}</div><div class="workspace"><section class="panel" id="library"></section><aside class="panel stack"><div class="eyebrow">CONJUNTO ATUAL</div><h2>${state.applied}</h2><p>Skin: ${state.skin}<br>Mapa: crepúsculo<br>Fonte: original<br>Anunciador: original</p><div class="line"></div><p class="small">Perfis guardam escolhas em conjunto. Conflitos são revisados antes de entrar na seleção.</p>${btn('Preparar com este conjunto',"go('prepare')",'gold')}</aside></div>`;let e=document.querySelector('#library');if(['Skins','Favoritas'].includes(state.collection))e.innerHTML=`<div class="row space"><h2>${state.collection}</h2><div><label for="collchamp">Campeão</label><select id="collchamp" onchange="state.champ=this.value;collection()">${['Ahri','Jinx','Lux','Akali'].map(c=>`<option ${state.champ===c?'selected':''}>${c}</option>`).join('')}</select></div></div>${state.collection==='Favoritas'&&!state.favorite?'<p class="empty">Nenhuma favorita ainda. Marque uma skin na coleção.</p>':`<div class="preview">${img('champions',state.champ,'champ')}<div><h3>${state.skin}</h3><p>Prévia de catálogo com retrato do campeão · demo</p></div></div><div class="row">${btn('Escolher skin',"skinModal()")}${btn(state.favorite?'Remover favorita':'Marcar favorita',"state.favorite=!state.favorite;collection();toast('Favoritas atualizadas.')")}${btn('Aplicar',"toast('Skin aplicada ao conjunto local.')",'gold')}</div>`}`;if(state.collection==='Perfis')e.innerHTML=`<h2>Perfis de conjunto</h2><p>Revise skins, mods e overlay antes de aplicar.</p>${['Essencial','Competitivo','Expressivo'].map(p=>`<div class="row space panel" style="margin-top:12px"><div><h3>${p}</h3><p class="small">${p==='Expressivo'?'Mapa crepúsculo + mapa clássico · conflito de categoria':'Skin + mapa + fonte + anunciador + overlay'}</p></div>${btn(state.applied===p?'Ativo':'Prévia',`state.profile='${p}';profileModal()`)}</div>`).join('')}`;if(state.collection==='Mods')e.innerHTML=`<div class="row space"><h2>Biblioteca de mods</h2>${btn('Importar demo',"state.mods.push('Mod importado '+state.mods.length);collection();toast('Importação demonstrativa concluída; nenhum arquivo foi lido.')")}</div><p>Gerencie conteúdo local por categoria.</p><div class="tabs">${['Mapas','Fontes','Anunciadores'].map(t=>btn(t,`modCategory('${t}')`)).join('')}</div><div class="scroll">${state.mods.map((m,i)=>`<div class="panel row space"><span>${m}</span>${btn('Editar',`editMod(${i})`)}</div>`).join('')}</div>`;if(state.collection==='Custom-wheel')e.innerHTML=`<h2>Custom-wheel</h2><p>Configure o seletor rápido de conteúdo da sessão.</p><div class="fields">${['Mapa','Fonte','Anunciador'].map((t,i)=>`<div><label for="wheel${i}">${t}</label><select id="wheel${i}"><option>Original</option><option>${t} personalizado demo</option></select></div>`).join('')}</div><label class="check"><input type="checkbox" checked>Ativar custom-wheel na sessão</label>${btn('Salvar escolhas',"toast('Custom-wheel atualizado em memória.')",'gold')}`}
function support(){main.innerHTML=`<div class="top"><div class="eyebrow">ATIVIDADE 03 / RESOLVER PROBLEMA</div><h1>Vamos deixar tudo pronto.</h1><p>Um lugar para verificar o estado e encontrar o próximo passo.</p></div><div class="grid"><div class="panel stack"><h2>Prontidão</h2><p class="ok">● 4 de 4 verificações locais</p><p>Cliente simulado disponível<br>Conjunto compatível<br>Pastas demonstrativas<br>Overlays habilitados</p>${btn('Verificar novamente',"toast('Verificação local concluída: 4 de 4. Não houve acesso ao cliente.')",'gold')}</div><div class="panel stack"><h2>Erros e diagnóstico</h2><p>Nenhum erro ativo na demonstração.</p>${btn('Simular erro de mod',"showError()")}${btn('Executar diagnóstico',"openModal('Diagnóstico local','<p>Cliente: simulado<br>Perfil: '+state.applied+'<br>Conflitos: '+(state.applied==='Expressivo'?'mapas duplicados':'nenhum')+'<br>Dados externos: desconectados</p><div class=notice>Relatório ilustrativo. Nenhum log real foi coletado.</div>')")}</div><div class="panel stack"><h2>Pastas</h2><p>Gerencie referências de instalação e conteúdo.</p><label for="folder">Pasta do League (demo)</label><input id="folder" value="C:\\Riot Games\\League of Legends"><label for="modsdir">Pasta de mods (demo)</label><input id="modsdir" value="C:\\SEXO2\\mods">${btn('Validar caminhos',"toast('Caminhos aceitos na demonstração; sistema de arquivos não acessado.')")}</div></div>`}
function openModal(t,b){lastFocus=document.activeElement;document.querySelector('#mtitle').textContent=t;document.querySelector('#mbody').innerHTML=b;document.querySelector('#modal').showModal();document.querySelector('#modal button').focus()}function closeModal(){document.querySelector('#modal').close();lastFocus?.focus()}document.querySelector('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});document.querySelector('#modal').addEventListener('keydown',e=>{if(e.key!=='Tab')return;let f=[...e.currentTarget.querySelectorAll('button,input,select,a')].filter(x=>!x.disabled),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
function settings(){openModal('Todas as configurações',`<div class="tabs">${['Geral','Seleção','Overlays'].map(t=>btn(t,`state.config='${t}';configBody()`,state.config===t?'active':'')).join('')}</div><div id="configbody"></div>`);configBody()}function configBody(){document.querySelector('#configbody').innerHTML=`<h3>${state.config}</h3>${(state.config==='Geral'?['Iniciar com o sistema','Verificar prontidão ao abrir','Pedir revisão de conflito']:state.config==='Seleção'?['Sugerir runas','Mostrar trios observados','Permitir escolha de skin']:['Habilitar overlays','Exibir timers de objetivos','Exibir lembretes de compra']).map((t,i)=>`<label class="check"><input type="checkbox" onchange="state.options['${state.config+i}']=this.checked" ${(state.options[state.config+i]??(i!==0))?'checked':''}>${t}</label>`).join('')}${btn('Salvar configurações',"closeModal();toast('Configurações salvas nesta demonstração.')",'gold')}`;document.querySelectorAll('#mbody .tabs button').forEach(b=>b.classList.toggle('active',b.textContent===state.config))}
function sessionPrefs(){openModal('Preferências da sessão','<p>Estas escolhas valem para o preparo atual.</p><label class="check"><input type="checkbox" checked>Sugerir runas automaticamente</label><label class="check"><input type="checkbox">Confirmar skin antes de aplicar</label><label class="check"><input type="checkbox" checked>Mostrar dados de confronto</label>'+btn('Salvar sessão',"closeModal();toast('Preferências da sessão atualizadas.')",'gold'))}
function profileModal(){openModal('Prévia · '+state.profile,`<div class="preview">${img('champions',state.champ,'champ')}<div><h3>${state.profile}</h3><p>${state.skin} · ${state.profile==='Competitivo'?'Mapa original · overlay competitivo':'Mapa crepúsculo · overlay essencial'}</p></div></div>${state.profile==='Expressivo'?'<div class="notice">Conflito: dois mapas no mesmo perfil. Será necessário escolher um antes da seleção.</div>':'<p class="ok">Nenhum conflito neste conjunto.</p>'}<p>Status: ${state.applied===state.profile?'ativo':'ainda não aplicado'}</p><div style="margin-top:16px">${btn('Aplicar conjunto',"state.applied=state.profile;closeModal();render();toast('Conjunto aplicado em memória.')",'gold')}</div>`)}
function enterSelection(){if(state.applied==='Expressivo')openModal('Resolva o conflito antes de entrar','<div class="notice">Mapa crepúsculo e mapa clássico ocupam a mesma categoria.</div><p>Escolha o mapa que deve permanecer nesta sessão.</p><div class="row" style="margin-top:15px">'+btn('Usar crepúsculo',"resolveConflict('crepúsculo')")+btn('Usar clássico',"resolveConflict('clássico')")+'</div>');else{state.step=1;prepare()}}function resolveConflict(m){state.applied='Expressivo · mapa '+m;closeModal();state.step=1;prepare();toast('Conflito resolvido antes da seleção.')}
function skinModal(){openModal('Escolher skin · '+state.champ,`<label for="skin">Skin</label><select id="skin"><option>Florescer Espiritual</option><option>Estrela Negra</option><option>Original</option></select><p>Catálogo ilustrativo. Exalted com croma que desativa CTRL5 não participa do sorteio.</p><div style="margin-top:18px">${btn('Selecionar',"state.skin=document.querySelector('#skin').value;closeModal();render();toast('Skin selecionada.')",'gold')}</div>`)}
function draw(){openModal('Elegibilidade → resultado ilustrativo',`<div class="notice">3 opções elegíveis · 1 excluída antes do ranking: Exalted + croma que desativa CTRL5.</div><p>Ponderação planejada para o futuro. Este resultado é uma demonstração sem fórmula ou chance calculada.</p><div class="preview">${img('champions',state.champ,'champ')}<div><h3>Florescer Espiritual</h3><p>${state.room?'Matheus · Florescer / Lia · Original / Pedro · Estrela Negra':'Resultado pessoal ilustrativo'}</p></div></div>${btn('Usar resultado',"state.skin='Florescer Espiritual';closeModal();prepare();toast('Resultado atribuído ao preparo local.')",'gold')}`)}
function bravery(){openModal('Bravura · proposta','<div class="eyebrow">UM DESAFIO PARA A PRÓXIMA PARTIDA</div><h2>Experimente sair do habitual.</h2><p>Revele uma proposta ilustrativa de campeão, rota e trio. Você escolhe se quer experimentar; nada é aprimorado ou aplicado automaticamente.</p><div style="margin-top:18px">'+btn('Revelar proposta',"revealBravery()",'gold')+'</div>')}function revealBravery(){document.querySelector('#mbody').innerHTML=`<div class="preview">${img('champions','Lux','champ')}<div><h3>Lux · Meio</h3><p>Proposta revelada · resultado ilustrativo</p></div></div><div class="items">${['6655','3089','3135'].map(x=>img('items',x)).join('')}<span>Trio sugerido para o desafio</span></div><p>Sem auto aprimoramento ou importação automática.</p><div style="margin-top:16px">${btn('Aceitar proposta local',"state.champ='Lux';closeModal();prepare();toast('Proposta aceita. Revise as escolhas na seleção.')")}</div>`}
function modCategory(t){openModal(t+' · biblioteca','<p>Conteúdo demonstrativo da categoria '+t+'.</p><label for="modname">Nome do conteúdo</label><input id="modname" value="'+t+' personalizado"><div style="margin-top:15px">'+btn('Adicionar à biblioteca',"state.mods.push(document.querySelector('#modname').value);closeModal();collection();toast('Conteúdo adicionado.')")+'</div>')}function editMod(i){openModal('Editar mod',`<label for="editmod">Nome</label><input id="editmod" value="${state.mods[i]}"><label class="check"><input type="checkbox" checked>Ativo no conjunto</label>${btn('Salvar edição',`state.mods[${i}]=document.querySelector('#editmod').value;closeModal();collection();toast('Mod atualizado.')`,'gold')}`)}function showError(){openModal('Mod não compatível · simulação','<div class="notice">O mapa selecionado não corresponde à versão simulada do cliente.</div><p>Próximo passo: desative o mapa e verifique a prontidão.</p>'+btn('Desativar e verificar',"closeModal();toast('Mapa desativado nesta simulação. Prontidão: 4/4.')",'gold'))}render();
</script></body></html>
