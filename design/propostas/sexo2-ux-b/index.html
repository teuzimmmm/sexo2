  if(m.cat==='Skins'&&(!m.champ||!m.base))return{k:'need',t:'Requer campeão e skin-base'};

const main=el('#main');
function keyOf(e){
  if(!e||e===document.body||!e.dataset)return'';

  if(e.dataset.act)return(e.closest('#qp')?'qp:':e.closest('#hdr')?'hdr:':e.closest('#md')?'md:':'')+'a:'+Object.values(e.dataset).join('|');

function findKey(k){
  if(!k)return null;

}
function render(){
  const ae=document.activeElement,k=keyOf(ae);
  const sel=ae&&typeof ae.selectionStart==='number'&&/search|text/.test(ae.type||'')?[ae.selectionStart,ae.selectionEnd]:null;
  const ms=main.scrollTop,qbEl=el('#qp .qb'),qs=qbEl?qbEl.scrollTop:0;

  main.scrollTop=ms;const q2=el('#qp .qb');if(q2)q2.scrollTop=qs;

  if(t&&t!==document.activeElement){t.focus({preventScroll:true});if(sel&&t.setSelectionRange){try{t.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  else if(!t&&k&&!el('#md').open)main.focus({preventScroll:true});
}

});

let rtimer=null;
function doImport(id,name,label){
  if(S.rimp.st==='importing')return;
  S.rimp={st:'importing',msg:name,id};render();
  clearTimeout(rtimer);
  rtimer=setTimeout(()=>{
    if(S.sim==='ok'){S.rimp={st:'success',msg:name,id};logImp(label,name+' importada')}
    else if(S.sim==='fail'){S.rimp={st:'failed',msg:name,id};logImp(label,'falhou: '+name)}
    else{S.rimp={st:'no_free_page',msg:name,id};logImp(label,'no_free_page: '+name)}
    say('Runas: '+S.rimp.st);render();
  },450);
}

A.enhClear=()=>{S.enh={st:'none',cards:[],unrec:false};say('Sem dados de aprimoramentos');render()};
A.enhFix=(d,t)=>{if(!t.value)return;S.enh={st:'offer',cards:[t.value],unrec:false};say('Corrigido manualmente: '+t.value);render()};
A.endMatch=()=>{S.step=0;S.locked=false;S.enh={st:'none',cards:[],unrec:false};S.panel=true;say('Partida encerrada (simulado). De volta a Antes da fila.');render()};
/* configurações */
A.cfgTab=d=>{S.cfgTab=d.a;mrefresh(settingsBody())};
A.cfgSave=()=>{S.cfg={...S.draft};S.draft=null;S.srcPref=S.cfg.fonte;say('Configurações salvas, sem reiniciar. Nenhuma importação foi feita.');closeModal()};
A.cfgCancel=()=>{S.draft=null;S.cfg.idioma=S.cfg.idioma;say('Rascunho descartado');closeModal()};
A.cfgSupport=()=>{closeModal();needSupportBack();S.view='support';say('Suporte aberto; rascunho preservado');render()};

/* ===== Eventos ===== */
function run(t){const f=A[t.dataset.act];if(f)f(t.dataset,t)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled||t.getAttribute('aria-disabled')==='true')return;
  if(!/^(BUTTON|A)$/.test(t.tagName))return;
  run(t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind&&S.draft){const k=t.dataset.bind;S.draft[k]=t.type==='checkbox'?t.checked:t.value;
    if(k==='idioma'){S.cfg.idioma=t.value;say('Idioma aplicado imediatamente: '+t.value);mrefresh(settingsBody())}return}
  if(t.dataset&&t.dataset.act&&/^(INPUT|SELECT)$/.test(t.tagName))run(t);
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.live)return;
  if(t.dataset.live==='mq'){S.modQ=t.value;render()}
  if(t.dataset.live==='cq'){S.collSearch=t.value;render()}
  if(t.dataset.live==='tq'){S.trioQ=t.value;render()}
  if(t.dataset.live==='rkey'){S.room.input=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const qp=el('#qp');
  if(el('#md').open||qp.hidden)return;
  if(qp.contains(document.activeElement)||document.activeElement===el('#dockbtn')){e.preventDefault();A.panelClose()}
});
window.addEventListener('resize',()=>placePanel());
S.queue='Ranqueada Solo/Duo';
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>placePanel());
</script>
</body>
</html>
